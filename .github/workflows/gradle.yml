# This workflow will build a Java project with Gradle
# For more information see: https://docs.github.com/actions/language-and-framework-guides/building-and-testing-java-with-gradle

name: Java CI with Gradle
on:
  push:
    branches:
      - ci-workflow-changes

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5
      with:
        persist-credentials: false
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: 21
        distribution: 'zulu'
    - name: Build with Gradle
      run: ./gradlew build

    - name: Generate Release Tag
      id: release_tag
      run: |
        # Generate a unique tag based on timestamp and commit SHA
        TIMESTAMP=$(date +%Y%m%d-%H%M%S)
        SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
        echo "tag=build-$TIMESTAMP-$SHORT_SHA" >> $GITHUB_OUTPUT
        echo "Generated tag: build-$TIMESTAMP-$SHORT_SHA"

    - name: Upload Velocity
      uses: marvinpinto/action-automatic-releases@master
      with:
        title: "Velocity-CTD"
        automatic_release_tag: "${{ steps.release_tag.outputs.tag }}"
        repo_token: "${{ secrets.GITHUB_TOKEN }}"
        files: "*/build/libs/*.jar"
        prerelease: false
